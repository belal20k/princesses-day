<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Princess Day! 👑💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #d6639a 100%);
            background-size: 200% 200%;
            animation: bgShift 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }
        @keyframes bgShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Floating hearts background */
        #hearts-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .float-heart {
            position: absolute;
            bottom: -40px;
            opacity: 0;
            animation: floatUp linear forwards;
        }
        @keyframes floatUp {
            0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.85; }
            90%  { opacity: 0.6; }
            100% { transform: translateY(-110vh) translateX(var(--drift)) rotate(var(--spin)); opacity: 0; }
        }

        /* Burst hearts on click */
        .burst-heart {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            animation: burst 1s ease-out forwards;
        }
        @keyframes burst {
            0%   { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            padding: 34px 28px;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(201, 24, 74, 0.25), 0 0 0 4px rgba(255, 255, 255, 0.5);
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.8s ease;
        }
        .card::before, .card::after {
            position: absolute;
            font-size: 26px;
            animation: heartbeat 1.6s ease-in-out infinite;
        }
        .card::before { content: "💖"; top: -16px; left: -10px; }
        .card::after  { content: "💗"; bottom: -16px; right: -10px; animation-delay: 0.8s; }

        h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 30px;
            color: #d63384;
            margin: 0 0 20px;
            line-height: 1.3;
        }
        .heart-title { display: inline-block; animation: heartbeat 1.4s ease-in-out infinite; }

        /* Progress hearts */
        #progress { margin-bottom: 14px; font-size: 22px; letter-spacing: 4px; }
        #progress .on  { filter: none; }
        #progress .off { filter: grayscale(1); opacity: 0.35; }

        .option-btn {
            display: block;
            width: 100%;
            padding: 13px 14px;
            margin: 11px 0;
            border: 2px solid #ffb3c6;
            border-radius: 16px;
            background: linear-gradient(135deg, #fff0f3, #ffe3ec);
            color: #c9184a;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
        }
        .option-btn:hover, .option-btn:focus-visible {
            background: linear-gradient(135deg, #ff4d6d, #d63384);
            color: white;
            border-color: #ff4d6d;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
            outline: none;
        }

        #final-screen { display: none; }

        .photo-wrap {
            position: relative;
            width: 230px;
            height: 230px;
            margin: 18px auto;
        }
        .photo-wrap::before {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 3px dashed #ff4d6d;
            animation: spin 14s linear infinite;
        }
        .princess-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ff4d6d;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.55);
            animation: glow 2.4s ease-in-out infinite;
        }
        .photo-wrap .badge {
            position: absolute;
            font-size: 28px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        .b1 { top: -6px;  right: 4px; }
        .b2 { bottom: 4px; left: -6px; animation-delay: 0.5s; }
        .b3 { bottom: -10px; right: 24px; font-size: 22px !important; animation-delay: 1s; }

        .message {
            color: #5a3a46;
            font-size: 16px;
            line-height: 1.8;
            min-height: 150px;
        }
        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            color: #d63384;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        .signature.show { opacity: 1; }

        .shayari {
            margin: 18px 0 6px;
            padding: 16px 14px;
            border-radius: 18px;
            background: linear-gradient(135deg, #fff0f3, #ffe3ec);
            border: 2px dashed #ffb3c6;
            font-family: 'Dancing Script', cursive;
            font-size: 21px;
            line-height: 1.7;
            color: #c9184a;
            display: none;
        }
        .shayari.show { display: block; }
        .shayari .line {
            display: block;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 1s ease, transform 1s ease;
        }
        .shayari .line.show { opacity: 1; transform: translateY(0); }

        #love-btn {
            margin-top: 14px;
            padding: 11px 24px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff4d6d, #d63384);
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(214, 51, 132, 0.4);
            transition: transform 0.2s;
        }
        #love-btn:active { transform: scale(0.94); }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 18px rgba(255, 77, 109, 0.45); }
            50%      { box-shadow: 0 0 38px rgba(255, 77, 109, 0.85); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <!-- Floating hearts background -->
    <div id="hearts-bg" aria-hidden="true"></div>

    <!-- Quiz Section -->
    <div class="card" id="quiz-box">
        <div id="progress" aria-hidden="true"></div>
        <h2 id="question-text">Question 1</h2>
        <div id="options-container"></div>
    </div>

    <!-- Final Surprise Section -->
    <div class="card" id="final-screen">
        <h2><span class="heart-title">💖</span> Happy Princess Day! <span class="heart-title">💖</span></h2>
        <div class="photo-wrap">
            <img src="photo.jpeg" alt="My Princess" class="princess-img">
            <span class="badge b1">💕</span>
            <span class="badge b2">💗</span>
            <span class="badge b3">👑</span>
        </div>
        <p class="message" id="love-message"></p>
        <div class="shayari" id="shayari">
            <span class="line">Teri muskurahat meri sabse haseen dua hai, 🌹</span>
            <span class="line">Tere bina har khushi adhoori, har pal soona hai.</span>
            <span class="line">Rab se bas itni si iltija hai meri, 💫</span>
            <span class="line">Tu hamesha meri zindagi ki roshni bani rahe. ❤️</span>
        </div>
        <button id="love-btn" type="button">Send me some love 💌</button>
    </div>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Yahan aap apne questions aur options badal sakte hain
        const quizData = [
            {
                question: "1. Is duniya ki sabse pyari aur cute ladki kaun hai? 💞",
                options: ["A) Aap khud 🥰", "B) Sirf Aap 😍", "C) Aap hi Aap 💖", "D) All of the above ❤️"]
            },
            {
                question: "2. Jab aap muskurati hain toh kya hota hai? 😊",
                options: ["A) Phool khilte hain 🌹", "B) Mera din ban jata hai ☀️", "C) Dil ki dhadkan badh jati hai 💓", "D) Sab kuch! ✨"]
            },
            {
                question: "3. Aaj ka din kiske naam hai? 👑",
                options: ["A) Meri Real-Life Princess ke 👸", "B) Queen of my heart ke 💘", "C) Aapke naam 💝"]
            }
        ];

        // Final romantic message (typewriter effect me dikhega)
        const finalMessage =
            "Aapne saare sawalon ke bilkul sahi jawab diye! 💕\n\n" +
            "Sach toh ye hai ki aap meri life ki sabse special aur pyari Princess hain. " +
            "Aapki ek smile mera poora din bana deti hai, aur aapki yaad mere dil ko sukoon deti hai. " +
            "Always keep smiling, kyunki aapki hasi me hi meri duniya hai. ❤️";

        let currentQuestion = 0;
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const quizBox = document.getElementById("quiz-box");
        const finalScreen = document.getElementById("final-screen");
        const bgMusic = document.getElementById("bg-music");
        const progress = document.getElementById("progress");
        const heartsBg = document.getElementById("hearts-bg");

        const heartEmojis = ["❤️", "💖", "💗", "💕", "💘", "💝", "🌸"];

        // ---------- Floating hearts ----------
        function spawnFloatHeart() {
            const h = document.createElement("span");
            h.className = "float-heart";
            h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            h.style.left = Math.random() * 100 + "vw";
            h.style.fontSize = (14 + Math.random() * 26) + "px";
            h.style.animationDuration = (7 + Math.random() * 7) + "s";
            h.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");
            h.style.setProperty("--spin", (Math.random() * 80 - 40) + "deg");
            heartsBg.appendChild(h);
            setTimeout(() => h.remove(), 15000);
        }
        setInterval(spawnFloatHeart, 550);
        for (let i = 0; i < 8; i++) setTimeout(spawnFloatHeart, i * 150);

        // ---------- Burst hearts (click par) ----------
        function burstHearts(x, y, count = 12) {
            for (let i = 0; i < count; i++) {
                const h = document.createElement("span");
                h.className = "burst-heart";
                h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const dist = 60 + Math.random() * 80;
                h.style.left = x + "px";
                h.style.top = y + "px";
                h.style.fontSize = (16 + Math.random() * 14) + "px";
                h.style.setProperty("--dx", Math.cos(angle) * dist + "px");
                h.style.setProperty("--dy", Math.sin(angle) * dist + "px");
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 1000);
            }
        }

        // ---------- Progress hearts ----------
        function renderProgress() {
            progress.innerHTML = quizData
                .map((_, i) => `<span class="${i <= currentQuestion ? "on" : "off"}">❤️</span>`)
                .join("");
        }

        // ---------- Quiz ----------
        function loadQuestion() {
            const q = quizData[currentQuestion];
            questionText.innerText = q.question;
            optionsContainer.innerHTML = "";
            renderProgress();

            q.options.forEach(option => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = (e) => {
                    const r = btn.getBoundingClientRect();
                    burstHearts(e.clientX || r.left + r.width / 2, e.clientY || r.top + r.height / 2);
                    nextQuestion();
                };
                optionsContainer.appendChild(btn);
            });
        }

        function nextQuestion() {
            // Pehle click par music start ho jayega
            if (currentQuestion === 0) {
                bgMusic.play().catch(e => console.log("Audio play prevented"));
            }

            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                quizBox.style.display = "none";
                finalScreen.style.display = "block";
                burstHearts(window.innerWidth / 2, window.innerHeight / 3, 24);
                typeMessage();
            }
        }

        // ---------- Typewriter message ----------
        function typeMessage() {
            const el = document.getElementById("love-message");
            let i = 0;
            (function tick() {
                el.innerHTML = finalMessage.slice(0, i).replace(/\n/g, "<br>");
                i++;
                if (i <= finalMessage.length) {
                    setTimeout(tick, 38);
                } else {
                    revealShayari();
                }
            })();
        }

        // ---------- Shayari (line by line) ----------
        function revealShayari() {
            const box = document.getElementById("shayari");
            const lines = box.querySelectorAll(".line");
            box.classList.add("show");
            lines.forEach((line, i) => {
                setTimeout(() => line.classList.add("show"), 400 + i * 1400);
            });
            setTimeout(() => {
                const r = box.getBoundingClientRect();
                burstHearts(r.left + r.width / 2, r.bottom, 16);
            }, 400 + lines.length * 1400);
        }

        // ---------- Love button ----------
        document.getElementById("love-btn").addEventListener("click", (e) => {
            burstHearts(e.clientX, e.clientY, 18);
        });

        loadQuestion();
    </script>

</body>
</html>
